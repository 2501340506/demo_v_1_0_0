version: 1
edition: M6 content.1 · 2026-10-17
disclaimer: 以当地预案和现场指挥为准
pages:
- id: 1
  title: 认识常见地质灾害
  diagram: types
  points:
  - 滑坡：斜坡上的土石向下滑动
  - 崩塌：陡坡岩土突然崩落
  - 泥石流：沟谷中夹带泥沙石块
  - 山洪与泥石流不能混为一谈
  source: 资料：应急管理部网站 S01/S02
- id: 2
  title: 留意异常，及时报告
  diagram: signs
  points:
  - 沟水骤停、猛涨或夹带树木
  - 沟谷传来异常轰鸣声
  - 先远离危险处，再及时报告
  - 没有异常，也不代表安全
  source: 资料：应急管理部网站 S02
- id: 3
  title: 听从指挥，按预案避险
  diagram: plan
  points:
  - 按当地预案和现场指挥撤离
  - 不为取财物延误避险
  - 不穿越泥石流沟，不急于返回
  - 到达集合点，配合人员清点
  source: 资料：S01/S02；清点为原创 S03
- id: 4
  title: 做好准备，熟悉演练
  diagram: prepare
  points:
  - 熟悉当地路线与集合点
  - 约定家人联络方式
  - 按需备水、食物、灯和药品
  - 参加演练，协助需要帮助者
  source: 资料：S01；准备建议为原创 S03
